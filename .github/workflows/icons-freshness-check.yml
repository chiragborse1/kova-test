name: Icon Assets Freshness

# The committed icon outputs must match what scripts/generate_icons.py
# renders from assets/kova/kova-mark-*.svg + assets/backgrounds/*.svg. Regular
# builds and user installs consume the committed files and never render, so
# this lane is what keeps them honest: regenerate, structural --check, then
# fail on any byte difference. Fix a red run with
# `node scripts/generate-icons.mjs` on a Kova runtime interpreter and commit.
#
# Byte-determinism note: resvg renders the same SVG to identical bytes on any
# host for pure-shape artwork.
#
# assets/banner.png is the one master that contains <text>. Its glyphs come
# from a font STACK (scripts/kova/make_banner.py), so a runner without the
# first-choice face falls back and the PNG legitimately differs in glyph
# outlines. That is a real cross-platform difference, not drift, so the banner
# is regenerated here to catch a stale mark (the mark itself is pure <path> and
# is byte-stable) rather than to assert byte equality. The script prints
# "unchanged" when the bytes already match, which is what a runner with the
# intended font reports.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Regenerate icons + diff against committed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The generator runs on a Kova runtime interpreter; [] exports one as KOVA_PYTHON.
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          cache-python: true
          prune-python-cache: true

      - name: Regenerate every target, verify structure, diff against committed
        env:
          KOVA_PAYLOAD_TAG: ''
          KOVA_BUILD_COMMIT: ''
        run: |
          node scripts/generate-icons.mjs
          node scripts/generate-icons.mjs --check
          python scripts/kova/make_mark.py
          python scripts/kova/make_banner.py
          if ! git diff --exit-code --stat || [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "::error::Committed brand assets are stale. Run 'node scripts/generate-icons.mjs', 'python scripts/kova/make_mark.py' and 'python scripts/kova/make_banner.py', then commit the result."
            exit 1
          fi
