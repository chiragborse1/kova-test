name: Icon Assets Freshness

# The committed icon outputs must match what scripts/generate_icons.py
# renders from assets/kova/kova-mark-*.svg + assets/backgrounds/*.svg. Regular
# builds and user installs consume the committed files and never render, so
# this lane is what keeps them honest: regenerate, structural --check, then
# fail on any byte difference. Fix a red run with
# `node scripts/generate-icons.mjs` on a Kova runtime interpreter and commit.
#
# Byte-determinism note: the SVG masters are byte-stable everywhere -- resvg
# renders pure-shape artwork identically on any host, and the CI log confirms all
# four kova-mark SVGs report "unchanged". The RASTERIZED targets are not:
# generate_icons.py hands PNG/ICO/ICNS to Pillow's writers (`img.save(format=...)`),
# whose output depends on the host Pillow build, so 33 files differ on a Linux
# runner while the SVGs do not. Neither does resvg: the difference is downstream
# of it. Asserting byte equality across hosts for those is not achievable, so
# this lane checks them STRUCTURALLY (generate-icons.mjs --check verifies every
# target renders and has the right geometry) and byte-compares only the SVGs.
#
# assets/banner.png is the one master that contains <text>. Its glyphs come
# from a font STACK (scripts/kova/make_banner.py), so a runner without the
# first-choice face falls back and the PNG legitimately differs in glyph
# outlines. That is a real cross-platform difference, not drift, so the banner
# is regenerated here to catch a stale mark (the mark itself is pure <path> and
# is byte-stable) rather than to assert byte equality. The script prints
# "unchanged" when the bytes already match, which is what a runner with the
# intended font reports.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Regenerate icons + diff against committed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The generator runs on a Kova runtime interpreter; [] exports one as KOVA_PYTHON.
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          cache-python: true
          prune-python-cache: true

      - name: Regenerate every target, verify structure, diff against committed
        env:
          KOVA_PAYLOAD_TAG: ''
          KOVA_BUILD_COMMIT: ''
        run: |
          # Structural check for every target, on any host: each one renders and
          # has the expected geometry. This is the real staleness signal and it
          # does not depend on the host's Pillow encoder.
          node scripts/generate-icons.mjs
          node scripts/generate-icons.mjs --check
          python scripts/kova/make_mark.py

          # Byte-compare only what IS byte-stable across hosts: the SVG masters.
          # Everything raster is verified structurally above, because Pillow's
          # PNG/ICO/ICNS writers are host-dependent (see the header).
          git diff --exit-code -- '*.svg'

          # The banner additionally renders text through a font STACK
          # (scripts/kova/make_banner.py), so a host without the first-choice face
          # renders different outlines for a perfectly correct banner. Report it,
          # do not fail on it.
          if ! python scripts/kova/make_banner.py --check; then
            echo "::notice::The committed banner differs from what THIS host renders, which is expected without the first-choice font (Bahnschrift). Byte equality is not asserted for it."
          fi

